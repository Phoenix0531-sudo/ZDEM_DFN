name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & tests (py${{ matrix.python-version }}, uv)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
      ZDEM_FORCE_PYQTGRAPH: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: System libs (headless Qt / OpenGL)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libxcb-xinerama0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 || true

      - name: Sync dependencies (frozen)
        run: |
          if [ -f uv.lock ]; then
            uv sync --frozen --extra dev || uv sync --frozen
          else
            uv sync --extra dev || uv sync
          fi

      - name: Required project files
        run: |
          test -f README.md
          test -f LICENSE || test -f LICENSE.md

      - name: Ruff (hard — critical rules)
        run: |
          uv run ruff check . --select E9,F63,F7,F82

      - name: Pytest (hard, tests/ only)
        run: |
          set -e
          if [ -d tests ]; then
            uv run pytest -q tests
          elif [ -d Test ]; then
            uv run pytest -q Test
          else
            echo "No tests/ directory"
            exit 1
          fi

      - name: pip-audit (advisory)
        continue-on-error: true
        run: |
          uv run pip install pip-audit
          uv run pip-audit || true

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Sync dependencies (frozen)
        run: uv sync --frozen --extra dev

      - name: Run tests with coverage
        run: |
          uv run pytest -q tests --cov=zdem_dfn --cov-report=term \
            --cov-report=xml --cov-report=json

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          include-hidden-files: true

      - name: Publish coverage badge (badges branch)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run python - <<'PY'
          import json
          with open("coverage.json", encoding="utf-8") as f:
              pct = json.load(f)["totals"]["percent_covered"]
          pct = round(pct)
          color = "brightgreen" if pct >= 90 else "green" if pct >= 80 else \
              "yellowgreen" if pct >= 70 else "yellow" if pct >= 50 else "red"
          badge = {"schemaVersion": 1, "label": "coverage",
                   "message": f"{pct}%", "color": color}
          with open("coverage-badge.json", "w", encoding="utf-8") as f:
              json.dump(badge, f)
          print(badge)
          PY
          mkdir "$RUNNER_TEMP/badge" && cd "$RUNNER_TEMP/badge"
          cp "$GITHUB_WORKSPACE/coverage-badge.json" .
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage-badge.json
          git commit -qm "update coverage badge"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges

  package:
    name: Packaging (wheel build + clean install)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist + wheel
        run: uv build

      - name: Install wheel into clean venv
        run: |
          uv venv .pkg-venv
          uv pip install --python .pkg-venv/bin/python dist/*.whl

      - name: Smoke test installed package
        run: |
          .pkg-venv/bin/python -c "from zdem_dfn import config, dfn, engine, geometry, io, main, plotting, sampling"
          .pkg-venv/bin/python -m zdem_dfn --version
          test -f dist/zdem_dfn-*.tar.gz
