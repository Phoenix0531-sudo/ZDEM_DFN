[project]
name = "zdem-dfn"
version = "1.1.1"
description = "Discrete fracture network (DFN) generator for ZDEM discrete element simulations"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "tqdm>=4.62.0",
  "matplotlib>=3.4.0"
]

[project.scripts]
zdem-dfn = "zdem_dfn.main:main"

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "pytest-cov>=6.0", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["zdem_dfn"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"examples/*.py" = ["E402"]
"tests/*.py" = ["E402"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=6.0",
    "ruff>=0.6",
]
